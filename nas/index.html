<!DOCTYPE html>
<html>
<head>
    <title>NAS</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
<h2>NASファイル一覧</h2>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul>
    {% for msg in messages %}
      <li>{{ msg }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<ul>
    {% for f in files %}
    <li><a href="{{ url_for('nas_download', filename=f) }}">{{ f }}</a></li>
    {% endfor %}
</ul>

<h3>アップロード</h3>
<form method="post" enctype="multipart/form-data">
    <input type="file" name="file">
    <button type="submit">アップロード</button>
</form>

<a href="{{ url_for('index') }}">戻る</a>
</body>
</html>
