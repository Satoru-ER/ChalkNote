<!DOCTYPE html>
<html>
<head>
    <title>ログイン</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../static/style.css">
    <script src="https://unpkg.com/html5-qrcode" defer></script>
</head>
<body>
<div class="page-shell">
  <header class="app-topbar">
    <div>
      <div class="brand-title">ChalkNote Login</div>
      <div class="brand-subtitle">QR + PIN 認証</div>
    </div>
  </header>

  <section class="page-header glass-panel">
    <h1>ログイン</h1>
    <p>QRコード（UUID）と6桁PINで認証します。管理者は管理者ホーム、先生は先生ページへ遷移します。</p>
  </section>

  <section class="glass-panel section-card">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash-list">
        {% for msg in messages %}
          <li>{{ msg }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <div class="form-grid-two">
      <div class="feature-card" style="padding:14px;">
        <h3>カメラでQRを読み取り</h3>
        <div class="button-group" style="margin: 0 0 10px;">
          <select id="camera-select" class="search-bar" style="margin:0; min-width: 220px;"></select>
          <button id="reload-cameras" type="button" class="tonal">カメラ再取得</button>
        </div>
        <div id="qr-reader" style="width:100%; max-width:360px;"></div>
        <div class="button-group">
          <button id="start-camera" type="button">カメラ開始</button>
          <button id="stop-camera" type="button" class="tonal">停止</button>
        </div>
      </div>

      <form id="login-form" method="post" style="display:grid; gap:10px; align-content:start;">
        <input type="hidden" name="next" value="{{ next_url }}" />

        <label for="qr_uuid">UUID（QRコード / 手入力）</label>
        <input id="qr_uuid" name="qr_uuid" class="search-bar" placeholder="例: 123e4567-e89b-12d3-a456-426614174000" required>

        <label for="pin">6桁PIN</label>
        <input id="pin" name="pin" class="search-bar" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required>

        <label style="display:flex;gap:8px;align-items:center;">
          <input type="checkbox" id="remember-login" checked>
          2日間ログイン情報を保持する
        </label>

        <button type="submit">ログイン</button>
      </form>
    </div>
  </section>
</div>

<script>
let scanner = null;
let scannerStarted = false;
const STORAGE_KEY = 'chalkly-login-cache';
const STORAGE_TTL_MS = 2 * 24 * 60 * 60 * 1000;

function normalizeUuid(text) {
  return (text || '').trim().toLowerCase();
}

function fillUuid(value) {
  document.getElementById('qr_uuid').value = normalizeUuid(value);
}

async function loadCameraList() {
  const select = document.getElementById('camera-select');
  select.innerHTML = '';

  if (!window.Html5Qrcode) {
    select.innerHTML = '<option>QRライブラリ未読込</option>';
    return;
  }

  try {
    const devices = await Html5Qrcode.getCameras();
    if (!devices.length) {
      select.innerHTML = '<option>カメラが見つかりません</option>';
      return;
    }

    devices.forEach((device, i) => {
      const opt = document.createElement('option');
      opt.value = device.id;
      opt.textContent = device.label || `Camera ${i + 1}`;
      select.appendChild(opt);
    });
  } catch (e) {
    select.innerHTML = '<option>カメラ一覧取得に失敗</option>';
  }
}

async function startScanner() {
  if (!window.Html5Qrcode) {
    alert('QRスキャナーを読み込めませんでした。手入力をご利用ください。');
    return;
  }

  if (!scanner) {
    scanner = new Html5Qrcode('qr-reader');
  }
  if (scannerStarted) {
    return;
  }

  const selectedCamera = document.getElementById('camera-select').value;
  const cameraConfig = selectedCamera ? { deviceId: { exact: selectedCamera } } : { facingMode: 'environment' };

  try {
    await scanner.start(
      cameraConfig,
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decodedText) => {
        fillUuid(decodedText);
      },
      () => {}
    );
    scannerStarted = true;
  } catch (error) {
    alert('カメラの起動に失敗しました。手入力をご利用ください。');
  }
}

async function stopScanner() {
  if (!scanner || !scannerStarted) {
    return;
  }
  await scanner.stop();
  scannerStarted = false;
}

function saveLoginCache() {
  const remember = document.getElementById('remember-login').checked;
  if (!remember) {
    localStorage.removeItem(STORAGE_KEY);
    return;
  }

  const payload = {
    uuid: normalizeUuid(document.getElementById('qr_uuid').value),
    pin: document.getElementById('pin').value.trim(),
    expiresAt: Date.now() + STORAGE_TTL_MS,
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
}

function loadLoginCache() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;

  try {
    const parsed = JSON.parse(raw);
    if (!parsed.expiresAt || Date.now() > parsed.expiresAt) {
      localStorage.removeItem(STORAGE_KEY);
      return null;
    }
    return parsed;
  } catch (e) {
    localStorage.removeItem(STORAGE_KEY);
    return null;
  }
}

function tryAutoLogin() {
  const cached = loadLoginCache();
  if (!cached) return;

  document.getElementById('qr_uuid').value = cached.uuid || '';
  document.getElementById('pin').value = cached.pin || '';
  document.getElementById('remember-login').checked = true;

  if (!sessionStorage.getItem('auto-login-tried') && cached.uuid && cached.pin) {
    sessionStorage.setItem('auto-login-tried', '1');
    document.getElementById('login-form').requestSubmit();
  }
}

document.getElementById('start-camera').addEventListener('click', startScanner);
document.getElementById('stop-camera').addEventListener('click', stopScanner);
document.getElementById('reload-cameras').addEventListener('click', loadCameraList);
document.getElementById('login-form').addEventListener('submit', saveLoginCache);
window.addEventListener('beforeunload', stopScanner);

window.addEventListener('load', async () => {
  await loadCameraList();
  tryAutoLogin();
});
</script>
</body>
</html>
