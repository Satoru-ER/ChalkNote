<!DOCTYPE html>
<html>
<head>
    <title>ChalkNote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
<div class="page-shell app-explorer-shell">
    <div class="drive-shell glass-panel">
        <main class="drive-stage">
            <header class="drive-header">
                <div class="drive-title">
                    <h1>黒板写真ナビ</h1>
                    <p>Material 3 Expressive を取り入れたドライブ風ビュー</p>
                </div>
                <div class="drive-stats">
                    <div class="stat-card">
                        <span class="stat-label">教科フォルダ</span>
                        <strong class="stat-value">{{ total_subjects }}</strong>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">登録画像</span>
                        <strong class="stat-value">{{ total_images }}</strong>
                    </div>
                </div>
            </header>

            <section class="map-canvas">
                <div class="route-strip glass-panel">
                    <div class="route-chip">Gallery Drive</div>
                    <div class="route-steps">黒板写真一覧 → 教科フォルダ → 画像確認</div>
                    <div id="view-state" class="route-distance">フォルダ一覧</div>
                </div>

                <div class="stage-split">
                    <div class="map-pane">
                        <div id="folder-container"></div>
                        <div id="tile-container" style="display:none;"></div>
                    </div>
                    <aside class="turn-pane">
                        <div class="turn-pane-head">
                            <strong id="turn-title">フォルダを選択</strong>
                            <small id="turn-subtitle">選択中フォルダの情報を表示します</small>
                        </div>
                        <div class="turn-distance"><span id="path-indicator" class="folder-meta" style="display:none;"></span></div>
                    </aside>
                </div>
            </section>
        </main>

        <aside class="side-rail">
            <div class="rail-brand">
                <div class="brand-dot"></div>
                <strong>ChalkNote</strong>
                <small>Expressive UI</small>
            </div>
            <nav class="rail-nav">
                <a class="rail-item active" href="#" aria-current="page" title="写真">📷</a>
                <a class="rail-item" href="{{ url_for('settings') }}" title="検索/設定">🔎</a>
                {% if is_teacher %}<a class="rail-item" href="{{ url_for('teacher') }}" title="先生">👩‍🏫</a>{% endif %}
                {% if is_admin %}<a class="rail-item" href="{{ url_for('admin_home') }}" title="管理">🛠</a>{% endif %}
                <a class="rail-item" href="{{ url_for('nickname_setup') }}" title="ニックネーム">🙂</a>
                <a class="rail-item" href="{{ url_for('logout') }}" title="ログアウト">🚪</a>
            </nav>
        </aside>
    </div>

    <section class="floating-command glass-panel">
        <div class="floating-row">
            <label for="folder-search" class="floating-label">検索</label>
            <input id="folder-search" class="search-bar" placeholder="教科フォルダを検索（例: science）" />
        </div>

        <div class="floating-row floating-actions">
            <button class="glass-button tonal" id="btnback" style="display:none;">← 教科一覧へ戻る</button>
            <button class="glass-button" id="btnhome">🏠 ホーム</button>
        </div>
    </section>
</div>

<div id="full-image-view">
    <div class="modal-card glass-panel">
        <button id="close-modal" class="glass-button tonal">閉じる</button>
        <img id="full-img" src="" alt="黒板画像">

        <div id="comment-section">
            <h3>コメント</h3>
            <div class="top-actions" style="margin: 0 0 8px;">
                <button type="button" id="ai-summary-btn" class="glass-button">AI説明・要点まとめ</button>
            </div>
            <div id="ai-summary-box" class="quick-help" style="display:none; margin:0 0 10px;">
                <strong>AI説明・要約</strong> <small id="ai-mode" class="folder-meta"></small>
                <p id="ai-explanation" class="folder-meta" style="margin:6px 0;"></p>
                <p id="ai-summary" class="folder-meta" style="margin:6px 0;"></p>
            </div>
            <ul id="comment-list" class="comment-list"></ul>
            <form id="comment-form">
                <input id="comment-text" class="search-bar" placeholder="コメントを入力（300文字まで）" maxlength="300" required />
                <button type="submit" class="glass-button">投稿</button>
            </form>
        </div>
    </div>
</div>

<script>
const folderData = {{ folders|tojson|safe }} || {};

function buildEncodedBlackboardUrl(path) {
    return `/blackboards/${String(path || '')
        .split('/')
        .map((segment) => encodeURIComponent(segment))
        .join('/')}`;
}

function normalizeImageItem(raw, folderName) {
    if (raw && typeof raw === 'object') {
        const name = raw.name || '';
        const commentKey = raw.comment_key || `${folderName}/${name}`;
        if (raw.url) {
            return { name, url: raw.url, comment_key: commentKey };
        }
        if (name) {
            const rel = folderName === '未分類' ? name : `${folderName}/${name}`;
            return { name, url: buildEncodedBlackboardUrl(rel), comment_key: commentKey };
        }
    }

    if (typeof raw === 'string') {
        const rel = raw.replace(/\\/g, '/');
        const name = rel.split('/').pop() || rel;
        const served = folderName === '未分類' ? rel : `${folderName}/${rel}`;
        return {
            name,
            url: buildEncodedBlackboardUrl(served),
            comment_key: `${folderName}/${rel}`,
        };
    }

    return null;
}

window.addEventListener('DOMContentLoaded', () => {
    const folderContainer = document.getElementById("folder-container");
    const tileContainer = document.getElementById("tile-container");
    const searchInput = document.getElementById("folder-search");
    const btnBack = document.getElementById("btnback");
    const btnHome = document.getElementById("btnhome");
    const pathIndicator = document.getElementById("path-indicator");
    const viewState = document.getElementById("view-state");
    const turnTitle = document.getElementById("turn-title");
    const turnSubtitle = document.getElementById("turn-subtitle");
    const modal = document.getElementById("full-image-view");
    const fullImg = document.getElementById("full-img");
    const commentList = document.getElementById("comment-list");
    const commentForm = document.getElementById("comment-form");
    const commentText = document.getElementById("comment-text");
    const aiSummaryBtn = document.getElementById("ai-summary-btn");
    const aiSummaryBox = document.getElementById("ai-summary-box");
    const aiExplanation = document.getElementById("ai-explanation");
    const aiSummary = document.getElementById("ai-summary");
    const aiMode = document.getElementById("ai-mode");
    const closeModalBtn = document.getElementById("close-modal");

    const LAST_FOLDER_KEY = "chalkly-last-folder";
    let activeImageKey = null;

    function renderFolders(query = "") {
        folderContainer.innerHTML = "";
        const entries = Object.entries(folderData)
          .filter(([name]) => name.toLowerCase().includes(query.toLowerCase()))
          .sort((a, b) => a[0].localeCompare(b[0]));

        if (entries.length === 0) {
            folderContainer.innerHTML = '<div class="empty-state">表示できるフォルダがありません。管理者が写真をアップロードすると表示されます。</div>';
            return;
        }

        entries.forEach(([folderName, files]) => {
            const normalizedFiles = (Array.isArray(files) ? files : [])
                .map((item) => normalizeImageItem(item, folderName))
                .filter(Boolean);
            const tile = document.createElement("button");
            tile.className = "folder-tile";
            const preview = normalizedFiles.length
                ? `<img class="folder-thumb" src="${normalizedFiles[0].url}" alt="${folderName} preview">`
                : '<div class="folder-thumb empty">No Image</div>';
            tile.innerHTML = `
                ${preview}
                <span class="folder-name">${folderName}</span>
                <span class="folder-meta">${normalizedFiles.length} 件の画像</span>
            `;
            tile.onclick = () => openFolder(folderName);
            folderContainer.appendChild(tile);
        });
        turnTitle.textContent = "フォルダを選択";
        turnSubtitle.textContent = `${entries.length} 件の教科フォルダがあります`;
        viewState.textContent = "フォルダ一覧";
    }

    function openFolder(folderName) {
        tileContainer.innerHTML = "";
        const images = (Array.isArray(folderData[folderName]) ? folderData[folderName] : [])
            .map((item) => normalizeImageItem(item, folderName))
            .filter(Boolean);

        if (images.length === 0) {
            tileContainer.innerHTML = '<div class="empty-state">この教科フォルダには画像がありません。</div>';
        } else {
            images.forEach((item) => {
                const tile = document.createElement("div");
                tile.className = "tile";
                tile.innerHTML = `<img src="${item.url}" alt="${item.name}">`;
                tile.onclick = () => openFullImage(item);
                tileContainer.appendChild(tile);
            });
        }

        localStorage.setItem(LAST_FOLDER_KEY, folderName);
        folderContainer.style.display = "none";
        tileContainer.style.display = "grid";
        btnBack.style.display = "inline-block";
        pathIndicator.style.display = "block";
        pathIndicator.textContent = `現在: blackboards/${folderName}`;
        turnTitle.textContent = folderName;
        turnSubtitle.textContent = `${images.length} 枚の画像`;
        viewState.textContent = "画像一覧";
    }

    function goHome() {
        folderContainer.style.display = "grid";
        tileContainer.style.display = "none";
        btnBack.style.display = "none";
        pathIndicator.style.display = "none";
        turnTitle.textContent = "フォルダを選択";
        turnSubtitle.textContent = "選択中フォルダの情報を表示します";
        viewState.textContent = "フォルダ一覧";
    }

    async function loadComments(imageKey) {
        commentList.innerHTML = '<li class="folder-meta">読み込み中...</li>';
        const res = await fetch(`/api/comments?image=${encodeURIComponent(imageKey)}`);
        const rows = await res.json();
        if (!rows.length) {
            commentList.innerHTML = '<li class="folder-meta">まだコメントはありません。</li>';
            return;
        }
        commentList.innerHTML = rows.map(c =>
          `<li><strong>${c.author_nickname || c.author_uuid}</strong>${c.deleted ? ' <em>(moderated)</em>' : ''}<br>${c.text}<br><small>${new Date(c.created_at).toLocaleString()}</small></li>`
        ).join('');
    }

    async function loadAiSummary(imageKey) {
        aiSummaryBox.style.display = 'block';
        aiExplanation.textContent = '読み込み中...';
        aiSummary.textContent = '';
        aiMode.textContent = '';

        const res = await fetch(`/api/ai/summary?image=${encodeURIComponent(imageKey)}`);
        const json = await res.json();
        if (!json.ok) {
            aiExplanation.textContent = json.error || 'AI要約の取得に失敗しました。';
            return;
        }
        aiExplanation.textContent = json.explanation || '';
        aiSummary.textContent = json.summary || '';
        aiMode.textContent = json.mode ? `(mode: ${json.mode})` : '';
    }

    function openFullImage(item) {
        activeImageKey = item.comment_key;
        fullImg.src = item.url;
        fullImg.alt = item.name;
        modal.style.display = "flex";
        aiSummaryBox.style.display = "none";
        aiExplanation.textContent = "";
        aiSummary.textContent = "";
        aiMode.textContent = "";
        loadComments(activeImageKey);
    }

    function closeFullImage() {
        modal.style.display = "none";
        fullImg.src = "";
        activeImageKey = null;
    }

    commentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!activeImageKey) return;

        const formData = new URLSearchParams();
        formData.set('image', activeImageKey);
        formData.set('text', commentText.value.trim());

        const res = await fetch('/api/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });
        const json = await res.json();
        if (!json.ok) {
          alert(json.error || 'コメント投稿に失敗しました');
          return;
        }
        commentText.value = '';
        loadComments(activeImageKey);
    });

    searchInput?.addEventListener("input", (e) => renderFolders(e.target.value));
    btnBack?.addEventListener("click", goHome);
    btnHome?.addEventListener("click", goHome);
    aiSummaryBtn?.addEventListener("click", () => { if (activeImageKey) loadAiSummary(activeImageKey); });
    closeModalBtn?.addEventListener("click", closeFullImage);
    modal?.addEventListener("click", (e) => { if (e.target === modal) closeFullImage(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeFullImage(); });

    try {
        renderFolders();
    } catch (err) {
        folderContainer.innerHTML = `<div class="empty-state">表示の初期化に失敗しました: ${err.message}</div>`;
    }

    const lastFolder = localStorage.getItem(LAST_FOLDER_KEY);
    if (lastFolder && folderData[lastFolder]) {
        openFolder(lastFolder);
    }
});
</script>
</body>
</html>
