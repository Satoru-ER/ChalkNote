<!DOCTYPE html>
<html>
<head>
    <title>黒板アプリ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../static/style.css">
    <script type="module" crossorigin src="https://glass.danilofiumi.com/web-comps/boundle.js"></script>
</head>
<body>
<div class="page-shell">
    <header class="page-header glass-panel">
        <h1>黒板写真一覧</h1>
        <p>フォルダを選択して、写真をすばやく確認できます。</p>
        <div class="top-actions">
            <a class="glass-button" href="{{ url_for('admin') }}">ICT係専用ページ</a>
            <a class="glass-button" href="{{ url_for('nas') }}">NASを開く</a>
        </div>
    </header>

    <section class="glass-panel" style="padding:16px;">
        <input id="folder-search" class="search-bar" placeholder="フォルダを検索（例: science）" />
        <div id="folder-container"></div>
        <div id="tile-container" style="display:none;"></div>
        <p id="path-indicator" class="folder-meta" style="margin: 12px 0 0; display:none;"></p>
    </section>

    <div id="button-layer">
        <button class="glass-button" id="btnback" style="display:none;">← 戻る</button>
        <button class="glass-button" id="btnhome">🏠 ホーム</button>
    </div>
</div>

<div id="full-image-view">
    <div class="modal-card glass-panel">
        <button id="close-modal" class="glass-button">閉じる</button>
        <img id="full-img" src="" alt="黒板画像">
    </div>
</div>

<script>
const folderData = {{ folders|tojson|safe }};
const folderContainer = document.getElementById("folder-container");
const tileContainer = document.getElementById("tile-container");
const searchInput = document.getElementById("folder-search");
const btnBack = document.getElementById("btnback");
const btnHome = document.getElementById("btnhome");
const pathIndicator = document.getElementById("path-indicator");
const modal = document.getElementById("full-image-view");
const fullImg = document.getElementById("full-img");

let currentFolder = null;

function renderFolders(query = "") {
    folderContainer.innerHTML = "";
    const entries = Object.entries(folderData)
      .filter(([name]) => name.toLowerCase().includes(query.toLowerCase()))
      .sort((a, b) => a[0].localeCompare(b[0]));

    if (entries.length === 0) {
        folderContainer.innerHTML = '<div class="empty-state">該当するフォルダがありません。</div>';
        return;
    }

    entries.forEach(([folderName, files]) => {
        const tile = document.createElement("button");
        tile.className = "folder-tile";
        tile.innerHTML = `
            <span class="folder-name">${folderName}</span>
            <span class="folder-meta">${files.length} 件の画像</span>
        `;
        tile.onclick = () => openFolder(folderName);
        folderContainer.appendChild(tile);
    });
}

function openFolder(folderName){
    currentFolder = folderName;
    tileContainer.innerHTML = "";

    const images = folderData[folderName] || [];

    if (images.length === 0) {
      tileContainer.innerHTML = '<div class="empty-state">このフォルダには画像がありません。</div>';
    } else {
      images.forEach(file => {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.innerHTML = `<img src="/blackboards/${folderName}/${file}" alt="${file}">`;
          tile.onclick = () => openFullImage(folderName, file);
          tileContainer.appendChild(tile);
      });
    }

    folderContainer.style.display = "none";
    tileContainer.style.display = "grid";
    btnBack.style.display = "inline-block";
    pathIndicator.style.display = "block";
    pathIndicator.textContent = `現在: blackboards/${folderName}`;
}

function goHome() {
    currentFolder = null;
    folderContainer.style.display = "grid";
    tileContainer.style.display = "none";
    btnBack.style.display = "none";
    pathIndicator.style.display = "none";
}

function openFullImage(folder, file){
    fullImg.src = `/blackboards/${folder}/${file}`;
    fullImg.alt = file;
    modal.style.display = "flex";
}

function closeFullImage(){
    modal.style.display = "none";
    fullImg.src = "";
}

searchInput.addEventListener("input", (e) => renderFolders(e.target.value));
btnBack.addEventListener("click", goHome);
btnHome.addEventListener("click", goHome);
document.getElementById("close-modal").addEventListener("click", closeFullImage);
modal.addEventListener("click", (e) => { if (e.target === modal) closeFullImage(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeFullImage(); });

renderFolders();
</script>
</body>
</html>
