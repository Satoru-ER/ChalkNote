<!DOCTYPE html>
<html>
<head>
    <title>黒板アプリ</title>
    <link rel="stylesheet" href="../static/style.css">
    <script type="module" crossorigin src="https://glass.danilofiumi.com/web-comps/boundle.js"></script>
</head>
<body>
<h1>黒板写真一覧</h1>

<div id="folder-container">
    {% for folder in folders %}
        <div class="folder-tile" onclick="openFolder('{{ folder }}')">{{ folder }}</div>
    {% endfor %}
</div>

<div id="tile-container" style="display:none;"></div>

<div id="full-image-view" style="display:none;">
    <span onclick="closeFullImage()" style="cursor:pointer;position:absolute;top:10px;right:20px;font-size:30px;color:white;">×</span>
    <img id="full-img" src="" style="max-width:90%; max-height:90%;">
</div>

<div id="button-layer">
    <sv-liquid-glass class="liquid-btn" id="btnback" styles='{"style":{"roundness":60,"padding_x":1,"padding_y":1},"text":{"content":"←","edit":false,"font_family":"Inter","size_weight":500,"font_size":3.5},"color":{"accent":"#D7DADD"}}' contrast="light"></sv-liquid-glass>
    <sv-liquid-glass class="liquid-btn" id="btnhome" styles='{"style":{"roundness":60,"padding_x":1,"padding_y":1},"text":{"content":"🏠️","edit":false,"font_family":"Inter","size_weight":500,"font_size":3.5},"color":{"accent":"#D7DADD"}}' contrast="light"></sv-liquid-glass>
    <sv-liquid-glass class="liquid-btn" id="btnfolder" styles='{"style":{"roundness":60,"padding_x":10,"padding_y":1},"text":{"content":"blackboards/science","edit":false,"font_family":"Inter","size_weight":500,"font_size":3.5},"color":{"accent":"#D7DADD"}}' contrast="light"></sv-liquid-glass>
    <sv-liquid-glass class="liquid-btn" id="btnsettings" styles='{"style":{"roundness":60,"padding_x":1,"padding_y":1},"text":{"content":"⚙","edit":false,"font_family":"Inter","size_weight":500,"font_size":3.5},"color":{"accent":"#D7DADD"}}' contrast="light"></sv-liquid-glass>
    <sv-liquid-glass class="liquid-btn" id="btninfo" styles='{"style":{"roundness":60,"padding_x":1,"padding_y":1},"text":{"content":"I","edit":false,"font_family":"Inter","size_weight":500,"font_size":3.5},"color":{"accent":"#D7DADD"}}' contrast="light"></sv-liquid-glass>
</div>

<a href="{{ url_for('admin') }}">ICT係専用ページへ</a>

<script>
const folderData = {{ folders|tojson|safe }};

function openFolder(folderName){
    const tileContainer = document.getElementById("tile-container");
    tileContainer.innerHTML = "";

    const images = folderData[folderName] || [];

    images.forEach(file => {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.innerHTML = `<img src="/blackboards/${folderName}/${file}" style="width:100%;height:auto;">`;
        tile.onclick = () => openFullImage(folderName, file);
        tileContainer.appendChild(tile);
    });

    document.getElementById("folder-container").style.display = "none";
    tileContainer.style.display = "flex";
}

function openFullImage(folder, file){
    const img = document.getElementById("full-img");
    img.src = `/blackboards/${folder}/${file}`;
    document.getElementById("full-image-view").style.display = "flex";
}

function closeFullImage(){
    document.getElementById("full-image-view").style.display = "none";
}
</script>
</body>
</html>
